name: Kickbase Daily Tracker

on:
  schedule:
    # 21:30 UTC = 22:30 Uhr MEZ (Winter) bzw. 23:30 Uhr MESZ (Sommer)
    # -> immer sicher NACH der 22:04-Uhr-Grenze, unabhängig von Zeitumstellung
    - cron: "30 21 * * *"
  workflow_dispatch: {}   # erlaubt manuelles Auslösen über den "Run workflow"-Button

permissions:
  contents: write         # nötig, damit der Job state.json/transfers_store.json zurückpushen darf

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: pip install requests pandas

      - name: Tracker ausführen
        env:
          KICKBASE_EMAIL: ${{ secrets.KICKBASE_EMAIL }}
          KICKBASE_PASSWORD: ${{ secrets.KICKBASE_PASSWORD }}
        run: python kickbase_tracker.py

      - name: Geänderte Daten zurückspeichern
        run: |
          git config user.name "kickbase-tracker-bot"
          git config user.email "kickbase-tracker-bot@users.noreply.github.com"
          git add state.json transfers_store.json
          git diff --staged --quiet || git commit -m "Tracker-Update $(date -u +%Y-%m-%d)"
          git push
